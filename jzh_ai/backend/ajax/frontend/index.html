<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <ul id="todos"></ul>
  <button id = "btn">点击我</button>
  <script>
    console.log('start');
    //事件的注册
    document.getElementById('btn').addEventListener('click',function(){
      console.log('点击了按钮');
    })
    // fetch的前辈
    // XMLHttpRequest
    //输入url,点击a标签
    //顶层本质是js 可以主动的去发起接口http接口,当前页面还在
    //fetch /xhr 请求接口,动态的更新页面 web 2.0 时代
    const xhr = new XMLHttpRequest();//实例化一个xhr对象
    //打开一个http通道
    xhr.open('GET','http://localhost:3000/todos');//打开一个连接 
    
    
    // 回调函数 callback
    xhr.onreadystatechange = function(){
      console.log('状态改变了',xhr.readyState);
      if(xhr.status === 200 && xhr.readyState === 4){
        // console.log('请求完成zzzz',xhr.responseText);
        const todos = JSON.parse(xhr.responseText);
        document.getElementById('todos').innerHTML = todos.map(todo => `<li>${todo.title}</li>`).join('');
        console.log(todos);
      
      }
    }
    xhr.send();//发送请求
    console.log('请求完成');
  </script>
</body>
</html>
