<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //js 灵活 高级脚本语言 不太想关注内存
    // [] {} 
    //最常用的 方括号 + 元素
    // const arr = [1,2,3,4,5];
    //如果不知道数组内的元素
    const arr = ["a","b","c","d","e"];
    // 特定的存储结构 一段连续的内存空间
    // 特定的行为 adt abstract data type  抽象数据类型
    console.log(arr.push(1));
    arr.push(2);
    arr.unshift(0);
    arr.pop();
    arr.shift();
    console.log(arr);
  </script>
</body>
</html>
