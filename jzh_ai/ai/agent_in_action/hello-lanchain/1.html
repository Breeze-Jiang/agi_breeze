<body>
  <script>
    //模拟天气查询
    //promise 有单个状态 pending fulfilled rejected
    //pending 等待状态，fulfilled 已完成状态，rejected 已拒绝状态
    //只能从pending 状态转换到fulfilled 或rejected 状态
// 封装成函数，调用时才创建Promise、启动定时器
function getWeather() {
    return new Promise((resolve) => {
        setTimeout(() => {
            resolve({ temp: 38, conditions: 'Sunny with Clouds'})
        }, 2000)
    })
}
function getTweets() {
    return new Promise((resolve) => {
        setTimeout(() => {
            resolve(['I like cake', 'BBQ is good too!'])
        }, 500)
    })
}

//     console.log(tweetsData);
//     console.timeEnd("my-operation"); // 总耗时≈2500ms
// }
    const main = async () => {
      console.time("my-operation-parallel");
      // 并行执行，等待所有Promise完成
      //一起执行
     const [weatherData,tweetsData] = await Promise.all([getWeather(),getTweets()]);
     console.timeEnd("my-operation-parallel"); // 总耗时≈2000ms
    }
    main();
  </script>
</body>
