<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPA</title>
</head>
<body>
  <header>
    <ul>
      <nav>
        <li><a href="#/page1">首页</a></li>
        <li><a href="#/page2">首页</a></li>
        <li><a href="#/page3">关于我们</a></li>
      </nav>
    </ul>
  </header>
  <div id="container"></div>
  <script>
    // 挂载点 只需要动态修改它
    // spa极大提升了用户体验
    class Hashrouter{
      constructor(){
        // 指向实例
        this.routers = {}; // 前后端分离, 前端路由集合
        // 传统的多页开发，前端没有独立的路由  前端路由集合
        window.addEventListener('hashchange',
        // this 指向事件发生的对象， window
        // apply call 手动指定this 区别是参数
        // bind 返回一个函数
        this.load.bind(this))
      }
      register(hash,callback){
        this.routers[hash] = callback;
      }
      load(){
        console.log(this);
        let hash = location.hash.slice(1); // window.location 负责导航部分
        let handler;
        if(!hash){

        }else{
          handler = this.routers[hash];
        }
        handler.call(this);

      }
    }
    // 前端路由
    let router = new Hashrouter();
    let container = document.getElementById('container');
    router.register('/page1',function(){
      container.innerHTML = '<h1>页面一</h1>';
    })
    router.register('/page2',function(){
      container.innerHTML = '<h1>页面二</h1>';
    })
    router.register('/page3',function(){
      container.innerHTML = '<h1>页面三</h1>';
    })
  </script>
</body>
</html>
