<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    .box {
      /* 弹性布局的元素 默认会对主轴进行排序 
      父与子之间的布局关系，*/
      display: flex;
      flex-wrap: wrap;
    }
    .item {
      width: 50%;
      background-color: pink;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
  </div>
</body>
</html>
